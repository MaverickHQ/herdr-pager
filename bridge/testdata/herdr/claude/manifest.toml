# What each of phase 0's Claude Code captures is (phase 2 design D2-7, R2.3).
# Tests classify the captures through this file, read with
# bridge/internal/captures, never by their file names. Written 2026-10-22
# (phase 2, task 1.3) from DETECTION.md, KEYS.md and the captures themselves.
#
# Each [[capture]]:
#   file         the detection read (`agent.read`, source detection), relative
#                to this folder; "" when not captured
#   agent        the `agent.get` taken with it; "" when not captured
#   captured     false for a prompt phase 0 couldn't capture (DETECTION.md
#                §Not captured): phase 2 treats it as unknown, so its card
#                offers only jump, and tests skip it
#   kind         permission; danger (a permission prompt the danger rules
#                flag: its card is a permission card with risk "danger");
#                question (no verdicts: jump only); or status (no prompt: the
#                agent isn't blocked)
#   prompt       the prompt on screen. Captures of one prompt share it, and
#                their cards hash equally; a prompt with one capture has
#                nothing to compare. (shell-repeat's box is identical to
#                shell's, but it's a second prompt, with its own seq.)
#   prompt_type  shell, file-edit, file-create, file-read, web-fetch,
#                mcp-tool, question, plan-approval, folder-trust, or none
#   title        the prompt box's title line as captured, without its leading
#                space: the card's summary before sanitizing
#   command      shell prompts: the command `command_match` extracts
#   path         file prompts (file-edit, file-create, file-read): the path
#                `file_match` extracts
#   url          fetch prompts: the URL `url_match` extracts, unless unread
#   tool, args   MCP calls: the server and the tool, and the argument lines
#                (each trimmed), as `mcp_match` extracts them, unless unread
#   unread       true for a permission prompt the keymap can't read in full:
#                its card fails closed (deny and jump only), and it names no
#                command, path, URL, tool or arguments
#   label        danger prompts: the danger rule's label
#
# The tool prompts (open item O-88) are a later set, in tool-prompts/, from
# Claude Code 2.1.316 (tool-prompts/VERSIONS; DETECTION.md §The tool
# prompts); they follow phase 0's.

