name: release

# A published version is built here, on its tag, never on a Mac (phase 5
# design D5P-2, requirement 3.1). Run by hand (workflow_dispatch), it's a dry
# run: it builds and checks everything and publishes nothing.
#
#   version   bridge/internal/version/VERSION; on a tag, the tag must be v<it>
#   firmware  the board's build in the pinned ESP-IDF container, with
#             -DPAGER_VERSION, from the committed component lock file
#   bridge    pager-bridge for macOS arm64, with the version in -ldflags,
#             after the bridge's own vet and tests
#   pack      tools/release: pack (the archive, libssh's source as the
#             component manager fetched it, THIRD_PARTY.md, SHA256SUMS),
#             verify, and the Homebrew formula; on a tag, the CHANGELOG entry
#   publish   on a tag only: build attestations and the GitHub release
#
# Its artefacts: release (exactly the release's files; a dry run's are checked
# again with `cd tools/release && go run ./verify <dir>`), formula
# (herdr-pager.rb, which the owner copies to MaverickHQ/homebrew-tap) and, on
# a tag, notes.
#
# Only the publish job, which runs on a tag alone, can write: it runs no code
# from the repository, only the attestation action and gh on the files the
# read-only jobs built and checked, and only when dist/ holds exactly the
# release's files.
#
# Every action is pinned by commit SHA (its release in the comment), and the
# ESP-IDF container by digest: lcd349-kit's pins at v0.2.2 (its release.yml,
# and its ci.yml for the container).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: The version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the version
        id: version
        run: |
          version=$(tr -d '[:space:]' < bridge/internal/version/VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]*)?$'; then
            echo "::error::bridge/internal/version/VERSION holds \"$version\", not a version number"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but bridge/internal/version/VERSION says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  firmware:
    name: The firmware (ESP-IDF, esp32s3)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Docker Hub's index digest for v5.5.6 (Ubuntu 24.04): change both together,
    # and ci.yml's with them.
    container: espressif/idf:v5.5.6@sha256:bf72fe7a15c22849a9a94147301165a545fb8905d97c176cf748e3e4614cac84
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: firmware/build-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The steps run as root, but the checkout belongs to the runner's user, so
      # git refuses it ("dubious ownership") for the lock file's check below.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware -B "$BUILD" -D SDKCONFIG="$BUILD/sdkconfig" -D PAGER_VERSION="$VERSION" set-target esp32s3 build
      # The component manager resolved the committed pins: a change to a
      # resolved version or hash means the build used something else. A change
      # of form alone (another component manager's layout) is shown, not fatal.
      - name: The build used the committed component lock
        shell: bash
        run: |
          if ! git diff --exit-code -- firmware/dependencies.lock.esp32s3; then
            if git diff -U0 -- firmware/dependencies.lock.esp32s3 | grep -Eq '^[-+][[:space:]]*(component_hash|version|commit_sha|source_url|path|git):'; then
              echo "::error::the build resolved other components than firmware/dependencies.lock.esp32s3 pins"
              exit 1
            fi
            echo "::notice::the component manager rewrote firmware/dependencies.lock.esp32s3's form, not its pins"
          fi
      # libssh's source as the component manager fetched it (LGPL-2.1, ADR
      # 0004), in a tar so its files keep their modes through the artefact.
      - name: libssh's source
        run: tar -C firmware/managed_components -cf "$RUNNER_TEMP/libssh.tar" david-cermak__libssh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-build
          path: |
            ${{ env.BUILD }}/flasher_args.json
            ${{ env.BUILD }}/bootloader/bootloader.bin
            ${{ env.BUILD }}/partition_table/partition-table.bin
            ${{ env.BUILD }}/herdr-pager.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libssh-component
          path: ${{ runner.temp }}/libssh.tar
          if-no-files-found: error

  bridge:
    name: pager-bridge for macOS arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          # A release build trusts no cache.
          cache: false
      - name: vet and test
        working-directory: bridge
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build
        working-directory: bridge
        env:
          # Reproducible: no cgo, no paths, no VCS stamp, no build ID.
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
          GOTOOLCHAIN: local
        run: |
          mkdir -p "$RUNNER_TEMP/bridge"
          go build -trimpath -buildvcs=false \
            -ldflags "-buildid= -X github.com/MaverickHQ/herdr-pager/bridge/internal/version.published=$VERSION" \
            -o "$RUNNER_TEMP/bridge/pager-bridge" ./cmd/pager-bridge
      - name: It says its version
        run: |
          got=$("$RUNNER_TEMP/bridge/pager-bridge" --version)
          if [ "$got" != "pager-bridge $VERSION" ]; then
            echo "::error::pager-bridge --version says \"$got\", not \"pager-bridge $VERSION\""
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge
          path: ${{ runner.temp }}/bridge/pager-bridge
          if-no-files-found: error

  pack:
    name: Pack, verify, the formula
    needs: [version, firmware, bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release/go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-build
          path: ${{ runner.temp }}/in/firmware
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge
          path: ${{ runner.temp }}/in/bridge
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libssh-component
          path: ${{ runner.temp }}/in
      - name: The release tools' tests
        working-directory: tools/release
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Pack and verify
        working-directory: tools/release
        run: |
          in="$RUNNER_TEMP/in"
          tar -C "$in" -xf "$in/libssh.tar"
          go run ./pack --version "$VERSION" --bridge "$in/bridge/pager-bridge" \
            --firmware "$in/firmware" --libssh "$in/david-cermak__libssh" \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/release"
          go run ./verify "$RUNNER_TEMP/release"
      - name: The formula
        working-directory: tools/release
        run: |
          mkdir -p "$RUNNER_TEMP/formula"
          go run ./formula --archive "$RUNNER_TEMP/release/herdr-pager_${VERSION}_darwin_arm64.tar.gz" \
            --template "$GITHUB_WORKSPACE/contrib/homebrew/herdr-pager.rb.tmpl" > "$RUNNER_TEMP/formula/herdr-pager.rb"
      - name: Summary
        run: |
          {
            echo "### herdr-pager $VERSION"
            echo '```'
            cat "$RUNNER_TEMP/release/SHA256SUMS"
            echo '```'
            echo "The formula (artefact formula, for MaverickHQ/homebrew-tap):"
            echo '```ruby'
            cat "$RUNNER_TEMP/formula/herdr-pager.rb"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: ${{ runner.temp }}/formula/herdr-pager.rb
          if-no-files-found: error
      # The release's notes: CHANGELOG.md's entry for the version, headed
      # "## v<version>" or "## <version>" (a date may follow).
      - name: The CHANGELOG entry
        if: github.ref_type == 'tag'
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v v="$VERSION" '
            /^## / {
              on = $0 == "## v" v || $0 == "## " v || index($0, "## v" v " ") == 1 || index($0, "## " v " ") == 1 || index($0, "## [" v "]") == 1
              next
            }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::CHANGELOG.md has no \"## v$VERSION\" entry"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  publish:
    name: Attestations and the release
    if: github.ref_type == 'tag'
    needs: [version, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # the attestations' signing identity
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # No checkout: this job runs nothing from the repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: dist holds exactly the release's files, as SHA256SUMS lists them
        run: |
          (cd dist && find . -mindepth 1 | sed 's|^\./||' | sort) > found.txt
          printf '%s\n' SHA256SUMS THIRD_PARTY.md "herdr-pager_${VERSION}_darwin_arm64.tar.gz" > expected.txt
          sed -n 's/^libssh-\(.*\)-source\.tar\.gz$/&/p' found.txt >> expected.txt
          sort -o expected.txt expected.txt
          if [ "$(grep -c '^libssh-.*-source\.tar\.gz$' found.txt)" -ne 1 ] || ! diff -u expected.txt found.txt; then
            echo "::error::dist/ doesn't hold exactly the release's files"
            exit 1
          fi
          (cd dist && sha256sum -c --strict SHA256SUMS)
          if [ "$(wc -l < dist/SHA256SUMS)" -ne 3 ]; then
            echo "::error::SHA256SUMS doesn't list exactly the three files"
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "herdr-pager $GITHUB_REF_NAME" --notes-file notes/notes.md dist/*
